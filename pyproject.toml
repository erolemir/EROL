[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erol-ai"
version = "0.2.0"
description = "Extensible Reasoning & Orchestration Layer with evidence-gated project learning"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{name = "erolemir and EROL contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/erolemir/EROL"
Issues = "https://github.com/erolemir/EROL/issues"

[project.scripts]
erol = "erol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erol = ["data/**/*.json", "data/**/*.md", "data/**/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
