name: release
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: erol-stable-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'erolemir/EROL' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Skip a superseded main commit
        id: current
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$SOURCE_SHA" ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.current.outputs.release == 'true'
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        if: steps.current.outputs.release == 'true'
        with:
          node-version: '24'
      - name: Prepare an automatically versioned distribution
        if: steps.current.outputs.release == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/release.py prepare --source-sha "$SOURCE_SHA"
      - name: Validate and build the versioned packages
        if: steps.current.outputs.release == 'true'
        run: |
          python -m pip install -e . -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python -m unittest discover -s tests
          python scripts/check_adapter_drift.py --check
          python scripts/validate.py
          python -m build
          python scripts/package_smoke.py
          npm pack --pack-destination dist
          python scripts/npm_package_smoke.py
      - name: Publish stable and immutable release artifacts
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/release.py publish
